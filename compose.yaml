
services:
  grpc_server:
    container_name: grpc_server
    image: grpc_server:1.0.0
    build:
      context: ./backend_grpc
      dockerfile: grpc.dockerfile
    environment:
      DATABASE_URL: 'postgres://postgres:postgres@db:5432/postgres?sslmode=disable'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  protoc_grpc:
    build:
      context: ./backend_grpc
      dockerfile: protoc.dockerfile
    volumes:
      - ./backend_grpc:/app
  nextapp:
    container_name: nextapp
    image: nextapp:1.0.0
    build:
      context: ./frontend_react
      dockerfile: next.dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - goapp
  goapp:
    container_name: goapp
    image: goapp:1.0.0
    build:
      context: .          # <-- was ./backend_go
      dockerfile: backend_go/go.dockerfile
    environment:
      DATABASE_URL: 'postgres://postgres:postgres@db:5432/postgres?sslmode=disable'
      GRPC_ADDR: 'grpc_server:50051'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8000/api/go/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      grpc_server:
        condition: service_started
  migrate:
    container_name: migrate
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@db:5432/postgres?sslmode=disable",
        "up"
      ]
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: db
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
